# By Sanae (submitted via /write, 18 Oct 2026). Grams as bought; quinoa is the dry weight for her 1 cup cooked.
published = "2026-10-18"
seo_name = "Quinoa Chicken Salad"  # short, search-style name used in the Google title
name = "Quinoa and Chicken Salad with Honey Mustard Yogurt Dressing"
cuisine = "American"
description = "Quinoa, sliced chicken, boiled eggs, feta and crunchy veg with a creamy honey mustard yogurt dressing. Two big bowls."
author = "Sanae"
intro = "My take on making healthy eating simple: chicken, eggs and quinoa for protein, fresh vegetables, and a homemade yogurt dressing. Nothing complicated, and it's flexible, so use whatever salad veg you have in the fridge."
servings = 2
meal = "lunch"
tags = ["grilled"]
prep_minutes = 15
cook_minutes = 20
image = "quinoa-chicken-salad-sanae.jpg"
image_alt = "A bowl of quinoa salad with sliced chicken, boiled egg, avocado, tomato, cucumber and feta"
image_credit = "Photo by Sanae."
storage = "Keep the salad and the dressing in separate airtight containers in the fridge, and eat the chicken within 3 to 4 days. For the best texture, add the avocado and dressing just before eating."
tip = "The chicken and eggs bring most of the protein. The salad vegetables, feta and avocado add cost but very little protein, so if you want it cheaper, trim those rather than the chicken: skip the feta or use half an avocado."
steps = [
  "Cook the quinoa: rinse it and cook it according to the package instructions. Set aside to cool slightly.",
  "Cook the chicken and eggs: season the chicken breast with salt and black pepper and cook it in a pan with the olive oil until cooked through on both sides, then slice. Boil the eggs, let them cool, and cut them into halves or quarters.",
  "Prepare the vegetables: wash and chop the lettuce, spinach, tomato and cucumber. Slice the avocado.",
  "Make the dressing: in a small bowl, mix the yogurt, mustard, minced garlic, honey and lemon juice. Add salt and black pepper to taste and stir until smooth and creamy.",
  "Assemble: add the quinoa and vegetables to a bowl. Top with the sliced chicken, eggs, avocado and crumbled feta. Drizzle with the dressing and toss gently, or serve the dressing on the side.",
]

