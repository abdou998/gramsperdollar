# By Sanae (submitted via /write, 2 Nov 2026). Her recipe gave no weights for chicken, potatoes or peppers:
# 400 g chicken, 500 g potatoes and one pepper of each colour are our assumptions for 2 servings (check with Sanae).
published = "2026-11-02"
seo_name = "Oven Chicken Skewers with Rice and Potatoes"  # short, search-style name used in the Google title
name = "Oven-Baked Chicken Brochettes with Seasoned Rice and Crispy Potatoes"
cuisine = "Mediterranean"
description = "Mustard-lemon chicken skewers with peppers, garlicky seasoned rice and crispy paprika potatoes, all from the oven. A full plate for two."
author = "Sanae"
intro = "A simple, filling, protein-rich plate from everyday ingredients. The chicken is tender and full of flavour from a tangy mustard and lemon marinade, while the seasoned rice and crispy potatoes make it properly satisfying. Next time I'd add more colourful vegetables or a fresh salad on the side."
servings = 2
meal = "dinner"
tags = []
prep_minutes = 20
cook_minutes = 40
image = "chicken-brochettes-rice-potatoes-sanae.jpg"
image_alt = "Chicken and pepper skewers with seasoned rice and roasted potato wedges on a white plate"
image_credit = "Photo by Sanae."
storage = "Keeps up to 3 days in the fridge in an airtight container. Reheat thoroughly, adding a little water to the rice so it stays moist."
tip = "Chicken breast in a big value pack is the cheapest way to keep this high in protein; boneless thighs work too. Frozen peppers are fine for the skewers, and a boiled egg or a spoon of Greek yogurt on the side adds extra protein for pennies."
steps = [
  "Roast the potatoes: heat the oven to 200°C (400°F). Cut the potatoes into even wedges or cubes, toss with olive oil, paprika, salt and pepper, and spread them out on a tray with space between the pieces. Bake 30 to 40 minutes, turning halfway, until golden and crispy.",
  "Marinate the chicken: cut the chicken into medium cubes. Mix the onion, half the garlic, the parsley, cumin, paprika, salt, pepper, lemon juice, mustard and yogurt (if using), then coat the chicken well. Cover and chill for at least 30 minutes.",
  "Make the skewers: thread the chicken onto skewers, alternating with squares of red and green pepper.",
  "Bake the skewers: place them on a lightly oiled tray and bake at 200°C (400°F), turning halfway, until the chicken is cooked through (74°C / 165°F in the thickest pieces).",
  "Cook the rice: rinse the rice until the water runs clearer, then boil it in salted water until tender and drain well.",
  "Season the rice: soften the rest of the onion in olive oil, add the rest of the garlic for 30 seconds, season with paprika, salt and pepper, then stir in the rice and cook 2 to 3 minutes so it soaks up the flavour.",
  "Serve: plate the rice with the skewers and crispy potatoes, and eat warm.",
]

