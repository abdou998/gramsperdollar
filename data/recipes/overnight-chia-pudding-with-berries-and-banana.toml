# By Sanae (submitted via /write, 19 Oct 2026). Grams as bought. "Greek yogurt" priced as each store's nonfat plain Greek yogurt.
seo_name = "Protein Overnight Chia Pudding"  # short, search-style name used in the Google title
name = "Overnight Chia Pudding with Berries and Banana"
published = "2026-10-19"
cuisine = "American"
description = "Chia seeds soaked overnight in milk and Greek yogurt, topped with banana, berries, pumpkin seeds and granola. One jar, ten minutes the night before."
author = "Sanae"
intro = "An easy make-ahead breakfast for busy mornings: chia seeds bring fibre and healthy fats, while the yogurt and milk add protein. Switch the fruit and toppings for whatever you have at home, or stir in a scoop of protein powder for an extra protein boost."
servings = 1
meal = "breakfast"
tags = ["no-cook", "single-serve"]
prep_minutes = 10
image = "overnight-chia-pudding-sanae.jpg"
image_alt = "A jar of chia pudding topped with sliced banana, blueberries, blackberries, pumpkin seeds and granola"
image_credit = "Photo by Sanae."
storage = "Keep covered in the fridge. The pudding base keeps up to 3 days, so you can make three jars at once. Add the banana and granola just before eating so they stay fresh and crunchy."
tip = "The berries cost the most here and add almost no protein. Frozen berries work just as well in a pudding and are usually much cheaper per ounce; the yogurt and chia are where the protein comes from."
steps = [
  "Mix the base: combine the chia seeds, milk, yogurt and honey (if using) in a bowl or jar. Stir well so no clumps form.",
  "Chill overnight: cover and refrigerate for at least 6 hours, ideally overnight, until the chia seeds have soaked up the liquid and the pudding has thickened.",
  "Add the toppings: in the morning, stir the pudding and top with the sliced banana, blueberries, blackberries, pumpkin seeds and granola. Add a splash of milk if you like it thinner.",
]

