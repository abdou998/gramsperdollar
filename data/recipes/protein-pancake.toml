# Protein pancake — single serving. Grams as weighed/bought.
# Whey: Abdessamad uses whey ISOLATE, 25 g scoop. Protein per 100 g must come from the tub's label
# (generic USDA whey entries don't match real isolates). See data/nutrition.csv.
name = "31g-protein pancake"
servings = 1

[[ingredients]]
item = "whey protein isolate"
grams = 25
note = "25 g whey isolate (Dymatize ISO100). Its official scoop is 30 g = 25 g protein; protein varies by brand."

[[ingredients]]
item = "baking powder"
grams = 4.6
note = "1 teaspoon"

[[ingredients]]
item = "egg whole"
grams = 50
note = "1 large egg"

[[ingredients]]
item = "milk whole"
grams = 122
note = "1/2 cup"

[[ingredients]]
item = "cinnamon ground"
grams = 0.5
note = "a dash"

[[ingredients]]
item = "butter salted"
grams = 4
note = "for the pan"

[[ingredients]]
item = "banana"
grams = 59
note = "half a medium banana"

[[ingredients]]
item = "dates medjool"
grams = 48
optional = true
note = "2 dates, chopped into the batter"
