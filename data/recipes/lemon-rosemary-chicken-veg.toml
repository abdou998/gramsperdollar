label = "olive oil, divided"

[[ingredients]]
item = "lemon juice and zest"
grams = 50
amount = "1"
label = "lemon, zest and juice"

[[ingredients]]
item = "garlic"
grams = 6
amount = "2 cloves"
label = "garlic, minced"

[[ingredients]]
