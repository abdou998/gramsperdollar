# Monthly Kroger price fetch via the official Kroger Public API.
# Needs repo secrets KROGER_CLIENT_ID and KROGER_CLIENT_SECRET (Settings > Secrets and variables > Actions).
# Monthly (and on push of data/kroger/run.txt): prices every store in data/kroger/stores.csv and recomputes recipe costs.
# run.txt line 1 = "locations <zip...>" to look up store ids, or "fetch <locationId...>" to fetch new stores without publishing.
name: kroger-prices
on:
  workflow_dispatch:
  push:
    paths: ['data/kroger/run.txt']
  schedule:
    - cron: '17 6 1 * *'
permissions:
  contents: write
concurrency: kroger
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
        run: |
          read -r cmd args < data/kroger/run.txt
          if [ "$cmd" = locations ] && [ "${{ github.event_name }}" = push ]; then
            python3 tools/kroger_fetch.py locations $args
          elif [ "$cmd" = fetch ] && [ "${{ github.event_name }}" = push ]; then
            # new stores: fetch only, picks get reviewed by hand before they go live
            python3 tools/kroger_fetch.py products $args
          else
            # every Kroger store we price: fetch -> pick -> prices.csv -> recipe costs
            mkdir -p data/todo
            tail -n +2 data/kroger/stores.csv | while IFS=, read -r loc sid; do
              python3 tools/kroger_fetch.py products "$loc"
              python3 tools/kroger_pick.py "$loc" "$sid"
              python3 tools/add_prices.py "$sid" "data/todo/$sid.tsv"
            done
            python3 tools/mealmath.py
          fi
      - name: Commit results
        run: |
          git config user.name "kroger-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kroger data/prices.csv src/data
          git diff --cached --quiet || (git commit -m "Kroger prices $(date -u +%F)" && git push)
